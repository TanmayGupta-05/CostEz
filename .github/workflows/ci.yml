name: Build and verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: costez
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: costez
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U costez" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: mkdir -p backend/src/main/resources/static && cp -r frontend/dist/. backend/src/main/resources/static/
      - run: mvn -B package
        working-directory: backend
        env:
          DEBUG: 'false'
      - run: java -jar backend/target/costez-1.0.0.jar > application.log 2>&1 &
        env:
          DEBUG: 'false'
          DATABASE_URL: jdbc:postgresql://localhost:5432/costez
          DATABASE_USER: costez
          DATABASE_PASSWORD: testing-only
          TOKEN_ENCRYPTION_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      - run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: costez-java21
          path: backend/target/costez-1.0.0.jar
