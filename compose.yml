services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: costez
      POSTGRES_USER: costez
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costez -d costez"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DEBUG: "false"
      DATABASE_URL: jdbc:postgresql://postgres:5432/costez
      DATABASE_USER: costez
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-CostezDemo2026!}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-costez@example.com}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_TLS: ${SMTP_TLS:-true}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
